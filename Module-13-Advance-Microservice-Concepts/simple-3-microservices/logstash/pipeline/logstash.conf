# ==========================================
# 1. INPUT SECTION
# ==========================================
input {
  file {
    # Recursively scans all service log files under /var/log/app/
    path => "/var/log/app/**/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

# ==========================================
# 2. FILTER SECTION
# ==========================================
filter {
  # Default fallback service name
  mutate {
    add_field => { "service_name" => "unknown-service" }
  }

  # Extract service folder name dynamically from log file path
  grok {
    match => { "[log][file][path]" => "/var/log/app/(?<service_name>[^/]+)/" }
    match => { "path" => "/var/log/app/(?<service_name>[^/]+)/" }
    overwrite => [ "service_name" ]
  }

  # Ensure service name is lowercase (Elasticsearch requirement for index names)
  mutate {
    lowercase => [ "service_name" ]
    strip => [ "message" ]
  }
}

# ==========================================
# 3. OUTPUT SECTION
# ==========================================
output {
  # Indexes to e.g. microservices-logs-order-service-2026.08.25
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservices-logs-%{service_name}-%{+YYYY.MM.dd}"
  }

  # Terminal debugging output
  stdout {
    codec => rubydebug
  }
}